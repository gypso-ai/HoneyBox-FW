name: verify-manifest

# The manifest is the only trust anchor of the online OTA channel, so every push
# that touches it must prove the signature still matches the published key.
on:
  push:
    paths:
      - 'manifest.json'
      - 'manifest.sig'
      - 'pubkeys.json'
      - 'verify_release.py'
      - '.github/workflows/verify-manifest.yml'
  pull_request:
    paths:
      - 'manifest.json'
      - 'manifest.sig'
      - 'pubkeys.json'
      - 'verify_release.py'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cryptography
        run: python -m pip install --quiet cryptography
      - name: Verify manifest signature
        run: python verify_release.py --dir .
      - name: Show manifest
        run: cat manifest.json
